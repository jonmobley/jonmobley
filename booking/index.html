<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booking | Jon Mobley</title>
    <meta
      name="description"
      content="Book Indianapolis magician, comedian, and emcee Jon Mobley for your corporate event, private party, or show. Tell us about your event and we'll get right back to you."
    />
    <link rel="canonical" href="https://jonmobley.com/booking/" />
    <link rel="icon" href="/images/favicon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/images/favicon-192.png" />
    <meta name="theme-color" content="#000000" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jon Mobley" />
    <meta property="og:url" content="https://jonmobley.com/booking/" />
    <meta property="og:title" content="Booking | Jon Mobley" />
    <meta
      property="og:description"
      content="Book Indianapolis magician, comedian, and emcee Jon Mobley for your event."
    />
    <meta property="og:image" content="https://jonmobley.com/images/og-home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Jon Mobley in a tuxedo seated in a lounge, beside the Sleight of Mind logo"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Booking | Jon Mobley" />
    <meta
      name="twitter:description"
      content="Book Indianapolis magician, comedian, and emcee Jon Mobley for your event."
    />
    <meta name="twitter:image" content="https://jonmobley.com/images/og-home.jpg" />

    <link rel="preconnect" href="https://nxsportal.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Raleway:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/booking.css?v=3" />
  </head>
  <body>
    <a class="skip-link" href="#form">Skip to form</a>

    <header class="bar">
      <div class="wrap bar-inner">
        <a class="home" href="/" aria-label="Jon Mobley home">
          <img class="logo" src="/images/logo.png" alt="Jon Mobley — Sleight of Mind" />
        </a>
      </div>
    </header>

    <main id="main">
      <section class="form-stage">
        <div class="wrap">
          <h1 class="visually-hidden">Booking inquiry</h1>
          <iframe
            id="form"
            class="booking-form"
            src="https://nxsportal.com/form/booking?embedAppearance=transparent&amp;embedResize=nexus-form-booking"
            title="Booking Inquiry"
            scrolling="no"
            loading="eager"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
          <p class="loading" aria-hidden="true">Loading form…</p>
          <p class="fallback">
            Trouble loading the form?
            <a href="https://nxsportal.com/form/booking" target="_blank" rel="noreferrer noopener"
              >Open it in a new tab</a
            >
            or email
            <a href="mailto:booking@jonmobley.com">booking@jonmobley.com</a>.
          </p>
        </div>
      </section>
    </main>

    <footer class="legal">
      <p>Copyright © 2026 Mobley Productions LLC.&nbsp; Indianapolis, IN USA.&nbsp; Laugh and Be Amazed</p>
    </footer>

    <script src="/js/booking.js?v=2"></script>
  </body>
</html>
